<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikka Колекції</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="https://dev.hikka.io/collections" target="_blank">
      <span class="logo-cpr">Hikka</span><span class="logo-catalog"> Колекції</span>
    </a>
    <div class="header-actions">
      <div class="collection-source-switch" id="js-collection-source" aria-label="Тип колекцій">
        <button class="collection-source-btn active" type="button" data-source="public" aria-pressed="true">Публічні</button>
        <button class="collection-source-btn" type="button" data-source="profile" aria-pressed="false">Профільні</button>
      </div>
      <button class="favorites-view-btn" id="js-favorites-view" type="button" aria-label="Показати обране" title="Показати обране" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/>
        </svg>
        <span class="favorites-view-count" id="js-favorites-count">0</span>
      </button>
      <button class="theme-toggle" id="js-theme-toggle" type="button" aria-label="Увімкнути світлу тему" title="Увімкнути світлу тему">
        <svg id="js-theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v2"/><path d="M12 19v2"/><path d="m5.64 5.64 1.42 1.42"/><path d="m16.94 16.94 1.42 1.42"/><path d="M3 12h2"/><path d="M19 12h2"/><path d="m5.64 18.36 1.42-1.42"/><path d="m16.94 7.06 1.42-1.42"/><circle cx="12" cy="12" r="4"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="main-wrap">
  <div class="toolbar">
    <div class="toolbar-count">
      <span class="count-label">КОЛЕКЦІЙ</span>
      <span class="count-value" id="js-count">0</span>
    </div>

    <div class="toolbar-search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="js-search" type="search" placeholder="Назва колекції або автор…" autocomplete="off">
    </div>

    <div class="toolbar-controls">
      <div class="filter-group">
        <select class="filter-select" id="js-sort" aria-label="Сортування">
          <button>
            <span class="select-label">За датою оновлення</span>
            <span class="select-chevron-v">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
            </span>
          </button>
          <option value="votes"><span>За голосами</span></option>
          <option value="created"><span>За датою створення</span></option>
          <option value="updated" selected><span>За датою оновлення</span></option>
          <option value="title"><span>За назвою</span></option>
        </select>
        <button class="filter-btn-icon sort-order-btn" id="js-sort-order" type="button" aria-label="За спаданням: більші значення спочатку" title="За спаданням: більші значення спочатку">
          <svg id="js-sort-order-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 6h14M5 12h10M5 18h6"/>
          </svg>
        </button>
      </div>

      <div class="select-wrap">
        <select class="filter-select" id="js-type" aria-label="Тип контенту">
          <button>
            <span class="select-label">Весь контент</span>
            <span class="select-chevron-v">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
            </span>
          </button>
          <option value="" selected><span>Весь контент</span></option>
          <option value="anime"><span>Аніме</span></option>
          <option value="manga"><span>Манга</span></option>
          <option value="novel"><span>Новела</span></option>
          <option value="character"><span>Персонажі</span></option>
          <option value="person"><span>Персони</span></option>
        </select>
      </div>

      <div class="select-wrap">
        <select class="filter-select" id="js-category" aria-label="Категорія">
          <button>
            <span class="select-label">Всі категорії</span>
            <span class="select-chevron-v">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
            </span>
          </button>
          <option value="" selected><span>Всі категорії</span></option>
        </select>
      </div>

      <label class="checkbox-wrap" title="Показати суб'єктивні колекції (зовнішність, почуття персонажів тощо)">
        <input type="checkbox" id="js-subjective">
        <span class="checkbox-box" aria-hidden="true"></span>
        <span class="checkbox-label">Суб'єктивні</span>
      </label>
    </div>
  </div>

  <section class="popular-tags" id="js-popular-tags" aria-label="Популярні теги" hidden>
    <div class="popular-tags-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L3 13V3h10l7.59 7.59a2 2 0 0 1 0 2.82Z"/><path d="M7 7h.01"/></svg>
      <span>Популярні теги</span>
    </div>
    <div class="popular-tags-list" id="js-popular-tags-list">
      <button class="popular-expand" id="js-popular-tags-toggle" type="button" hidden>Показати все</button>
    </div>
  </section>

  <section class="popular-tags popular-authors" id="js-popular-authors" aria-label="Популярні автори" hidden>
    <div class="popular-tags-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><path d="M18 20a6 6 0 0 0-12 0"/><circle cx="12" cy="10" r="4"/><path d="M20 8v6"/><path d="M23 11h-6"/></svg>
      <span>Популярні автори</span>
    </div>
    <div class="popular-tags-list popular-authors-list" id="js-popular-authors-list">
      <button class="popular-expand" id="js-popular-authors-toggle" type="button" hidden>Показати все</button>
    </div>
  </section>

  <div class="grid" id="js-grid" role="list" aria-label="Список колекцій"></div>

  <div class="empty-state" id="js-empty" hidden>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 9h6M9 12h4m-7 8h10a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2z"/></svg>
    <p>Нічого не знайдено</p>
  </div>

  <nav class="pagination" id="js-pagination" aria-label="Пагінація"></nav>
</main>

<script src="app.js"></script>
</body>
</html>
